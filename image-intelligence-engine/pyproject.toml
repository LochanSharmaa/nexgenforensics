[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-intelligence-engine"
version = "0.2.0"
description = "Image Intelligence & OSINT Investigation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "arq>=0.26",
    "redis>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "tldextract>=5",
    "pillow>=10",
    "imagehash>=4.3",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = [
    "api*", "worker*", "shared*", "database*", "crawler*", "providers*",
    "image_discovery*", "page_processing*", "entity_extraction*", "correlation*",
    "confidence*", "graph*", "timeline*", "monitoring*", "copilot*", "search*",
    "reports*", "workspace*", "retention*", "export*", "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jose.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "ASYNC", "S", "C4", "SIM"]
ignore = [
    "S101",   # assert: the test suite is built on it
    "B008",   # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]        # test credentials are not secrets
"scripts/**" = ["S608"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
exclude = ["database/migrations/"]

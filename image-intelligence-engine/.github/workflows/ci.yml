name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Runs first and alone. If a face-recognition library is present, nothing else
  # about this build matters (ARCHITECTURE §14).
  compliance:
    name: Compliance guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Forbidden dependency guard
        run: python scripts/check_forbidden_deps.py

      - name: Architecture boundary tests
        run: pytest tests/architecture -q

  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true
      - name: Mypy
        run: mypy shared database api worker
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: compliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit and integration tests
        env:
          IIE_ENVIRONMENT: test
        run: pytest -q --cov=shared --cov=database --cov=api --cov-report=term-missing

  migrations:
    name: Migrations against PostgreSQL
    runs-on: ubuntu-latest
    needs: compliance
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iie
          POSTGRES_PASSWORD: iie
          POSTGRES_DB: iie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iie -d iie"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]" psycopg[binary]

      - name: Upgrade to head
        env:
          IIE_DATABASE_URL: postgresql+asyncpg://iie:iie@localhost:5432/iie
        run: alembic upgrade head

      # A migration without a working downgrade is a migration that cannot be
      # rolled back in an incident.
      - name: Downgrade to base
        env:
          IIE_DATABASE_URL: postgresql+asyncpg://iie:iie@localhost:5432/iie
        run: alembic downgrade base

      - name: Upgrade again
        env:
          IIE_DATABASE_URL: postgresql+asyncpg://iie:iie@localhost:5432/iie
        run: alembic upgrade head

      # Catches a model changed without a matching migration, which would
      # otherwise only surface on someone else's machine.
      - name: No un-migrated model changes
        env:
          IIE_DATABASE_URL: postgresql+asyncpg://iie:iie@localhost:5432/iie
        run: alembic check

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: compliance
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build api worker
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify health
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/health/ready
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

# Local-first deployment. `docker compose up` brings the whole stack up healthy.
#
# Two application images by design (ARCHITECTURE §3): the api stays small, while
# the worker carries Playwright, Tesseract and spaCy from Phase 6 onward.

name: image-intelligence-engine

x-app-env: &app-env
  IIE_ENVIRONMENT: ${IIE_ENVIRONMENT:-local}
  IIE_DATABASE_URL: postgresql+asyncpg://iie:${POSTGRES_PASSWORD:-iie}@postgres:5432/iie
  IIE_REDIS_URL: redis://redis:6379/0
  IIE_S3_ENDPOINT_URL: http://minio:9000
  IIE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  IIE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  IIE_S3_BUCKET: iie-artifacts
  IIE_SECRET_KEY: ${IIE_SECRET_KEY:-}
  IIE_LOG_LEVEL: ${IIE_LOG_LEVEL:-INFO}
  IIE_LOG_FORMAT: ${IIE_LOG_FORMAT:-json}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iie}
      POSTGRES_DB: iie
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `-d iie` matters: without it pg_isready reports ready before the
      # database itself exists, and dependents start too early.
      test: ["CMD-SHELL", "pg_isready -U iie -d iie"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Runs migrations to completion, then exits. Both api and worker wait on it,
  # so neither can start against a schema that is not yet current.
  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment: *app-env
    command:
      ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    environment: *app-env
    command: ["arq", "worker.main.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import arq, database, shared; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

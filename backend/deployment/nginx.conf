events {
  worker_connections 1024;
}

http {
  # Model loading and large-gallery searches exceed nginx's 60s default, and a
  # timeout mid-search leaves the client unable to distinguish a failure from a
  # genuine no-match.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # Base64 image payloads inflate by roughly a third, so this sits above the
  # backend's own 15 MB ceiling. Cutting requests off here instead would deny
  # the API the chance to return a proper error.
  client_max_body_size 24m;
  client_body_timeout 60s;

  # Coarse limit in front of the application's own per-principal limiter. This
  # one is keyed by source address, so it still applies to a caller rotating
  # credentials.
  limit_req_zone $binary_remote_addr zone=imatch_api:10m rate=10r/s;
  limit_req_status 429;

  server_tokens off;

  upstream imatch_api {
    server nexgen-imatch-api:8443;
    keepalive 16;
  }

  server {
    listen 8080;

    location /api/ {
      limit_req zone=imatch_api burst=20 nodelay;

      proxy_pass http://imatch_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite rather than append. $proxy_add_x_forwarded_for preserves a
      # client-supplied header, which would then be recorded as the caller's
      # address in the audit trail.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/health {
      access_log off;
      proxy_pass http://imatch_api;
      proxy_set_header Host $host;
    }
  }
}

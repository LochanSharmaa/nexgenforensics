[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgen-imatch"
version = "1.0.0"
description = "NexGen iMATCH - facial recognition platform for forensic investigation"
requires-python = ">=3.11"
license = { file = "../LICENSE" }

dependencies = [
    "fastapi>=0.115.6,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "python-multipart>=0.0.20,<0.1",
    "pydantic>=2.10.5,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "sqlmodel>=0.0.22,<0.1",
    "SQLAlchemy>=2.0.36,<3.0",
    "pillow>=11.1.0,<12.0",
    "numpy>=2.2.1,<3.0",
    "cryptography>=44.0.0,<45.0",
    "argon2-cffi>=23.1.0,<25.0",
    "PyJWT>=2.10.1,<3.0",
    "httpx>=0.28.1,<1.0",
]

[project.optional-dependencies]
engine = [
    "insightface>=0.7.3,<0.8",
    "onnxruntime>=1.20.0,<2.0",
    "opencv-python-headless>=4.10.0,<5.0",
    "scikit-image>=0.24.0,<1.0",
]
dev = [
    "pytest>=8.3.4,<9.0",
    "pytest-asyncio>=0.25.0,<1.0",
    "pytest-cov>=6.0.0,<8.0",
    "ruff>=0.8.0,<1.0",
]

[tool.setuptools]
packages = ["nexgen_engine", "imatch_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: requires the real recognition model or a dataset",
]
filterwarnings = [
    "error::DeprecationWarning:imatch_api.*",
    "error::DeprecationWarning:nexgen_engine.*",
]

[tool.ruff]
line-length = 118
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the framework's idiom
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E712"]

services:
  api:
    build:
      context: ./backend
      dockerfile: deployment/Dockerfile
    container_name: nexgen-imatch-api
    ports:
      - "8443:8443"
    environment:
      NEXGEN_ENV: production
      NEXGEN_DATABASE_URL: postgresql+psycopg://imatch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/imatch
      NEXGEN_JWT_SECRET: ${NEXGEN_JWT_SECRET:?set NEXGEN_JWT_SECRET}
      NEXGEN_TEMPLATE_KEY: ${NEXGEN_TEMPLATE_KEY:?set NEXGEN_TEMPLATE_KEY}
      NEXGEN_CORS_ORIGINS: ${NEXGEN_CORS_ORIGINS:-http://localhost:5173}
      NEXGEN_ENGINE_MODE: ${NEXGEN_ENGINE_MODE:-auto}
      NEXGEN_MODEL_ROOT: /models
      NEXGEN_STORAGE_ROOT: /data/storage
      NEXGEN_AUDIT_LOG_PATH: /data/audit.jsonl
    volumes:
      - model_cache:/models
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexgen-imatch-postgres
    environment:
      POSTGRES_USER: imatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: imatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imatch -d imatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  model_cache:
  api_data:

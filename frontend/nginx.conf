# Site config for the web container: static SPA + /api reverse proxy.
# The upstream name "api" is the docker-compose service name.

server {
  listen 8080;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Base64 image payloads inflate by ~a third; sits above the backend's own
  # 15 MB ceiling so the API gets to return a proper error instead of nginx
  # cutting the request off.
  client_max_body_size 24m;

  # Baseline security headers for the HTML/asset responses. The API sets its
  # own (stricter) headers on /api responses.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://api:8443;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite rather than append: a client-supplied X-Forwarded-For would
    # otherwise be recorded as the caller's address in the audit trail.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Model warm-up and large-gallery searches exceed the 60s default; a
    # timeout mid-search is indistinguishable from a genuine no-match.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # SPA routing: every non-file path falls through to index.html.
  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets are immutable; cache them hard. index.html is NOT
  # matched here, so a new deploy is picked up on the next page load.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
